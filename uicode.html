<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티켓 백업 코드</title>
    <style>
        /* State 1: Original CSS Ticket */
        .card {
          --width: 280px;
          --height: 480px;
          --perforation-size: 18px;
          --cutouts-adjust: 110px;

          position: relative;
          display: grid;
          grid-template-rows: auto 1fr auto;
          gap: 1rem;
          grid-template-areas:
            "header"
            "body"
            "footer";

          width: var(--width);
          height: var(--height);
          padding: var(--perforation-size) 0;
          overflow: hidden;
          filter: drop-shadow(0 40px 40px #00000025);
          font-family: 'Noto Serif KR', serif;
          user-select: none;
        }

        .filter {
          position: absolute;
        }

        .ticket-header {
          position: relative;
          grid-area: header;
          margin: 0 12px;
          padding-top: 25px;
          text-align: center;
          z-index: 2;
          font-family: "Impact", sans-serif;
          font-size: 2.5rem;
          letter-spacing: 2px;
          color: #ffffff9f;
          text-shadow: 0 0 0 #000;
          -webkit-text-stroke: #fff 0.5px;
          mix-blend-mode: difference;
        }

        .ticket-body-new {
          grid-area: body;
          margin: 0 1.5em;
          padding: 1.5em 0.5em;
          font-weight: 400;
          z-index: 2;
          text-align: center;
          line-height: 2;
          color: #222;
          font-size: 1.2rem;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        .ticket-footer {
          grid-area: footer;
          z-index: 2;
          margin: 0 1.5em 3em 1.5em;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 40px;
        }

        .bg {
          position: absolute;
          inset: 0;
          background-color: #fff;
          filter: url(#bump);
          mask:
            radial-gradient(circle at 50% 0, #fff0 13px, #000 14px),
            radial-gradient(circle at 50% 100%, #fff0 13px, #000 14px),
            radial-gradient(circle 12px at left 110px, #000 98%, #0000 100%),
            radial-gradient(circle 12px at right 110px, #000 98%, #0000 100%),
            repeating-linear-gradient(90deg, #000 15px, #000 22px, #0000 23px, #0000 35px);
          mask-repeat: repeat-x, repeat-x, no-repeat, no-repeat, repeat-x;
          mask-size: 36px 100%, 36px 100%, 24px 24px, 24px 24px, 15px 3px;
          mask-position: 9px top, 9px bottom, left 110px, right 110px, 0 120px;
          mask-composite: intersect, exclude, add, add;
        }

        .holographic {
          background-image: linear-gradient(to bottom, #fe58, 90%, #0002),
            conic-gradient(at 60% 50%, #ccc, #ff6bfe, #00f9f8, #ddd, #0081fd, #eef0bc, #0081fd, #ff6bfe, #0002, #0081fd, #ddd, #01fefb, #ccc);
        }
    </style>
</head>
<body>
    <div id="css-ticket" class="ticket-animation-container">
        <div class="card">
            <div class="bg holographic"></div>
            <div class="ticket-header">TICKET</div>
            <div class="ticket-body-new">
                <em style="font-size: 1.4rem; font-weight: 600; color: #b76e79;">ㅁㅁ ❤️ ㅁㅁ 결혼식</em><br />
                2026. 10. 17. (토) 18:00<br />
                오하 하우스 웨딩
            </div>
        </div>
    </div>
</body>
</html>
